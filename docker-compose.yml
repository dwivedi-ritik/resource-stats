services:
  stats-lite:
    image: ghcr.io/ritik/stats-lite:latest
    build: .
    container_name: stats-lite
    restart: unless-stopped
    # Change the left number to pick the port you open in the browser,
    # for example "9090:8080" -> http://<machine-ip>:9090
    ports:
      - "8080:8080"
    # WHY: sharing the host PID namespace lets the container read the host's
    # processes, load and (through /host/proc/1) the host's real network
    # counters, so ordinary port mapping works on Linux servers and on Docker
    # Desktop alike. Host networking is NOT required.
    pid: host
    environment:
      STATS_LITE_ADDR: ":8080"
      # Uncomment to require a login: STATS_LITE_AUTH: "admin:change-me"
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
      HOST_ETC: /host/etc
      STATS_LITE_HOST_ROOT: /host
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
